<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LaRopa</title>
    <link rel="stylesheet" type="text/css" href="stylesheet/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav id="nav">
      <div class="nav-container">
        <div class="logo">
          <h1>LaRopa</h1>
        </div>
        <form class="search-container">
          <input type="text" placeholder="Search" name="search" />
          <button type="submit"><i class="fa fa-search"></i></button>
        </form>
        <div class="nav-login">
          <a href="#" class="user"
            ><i class="fa-solid fa-user"></i>Login and register</a
          >
        </div>
      </div>
    </nav>
    <nav id="nav1">
      <a href="Home.html">Home</a>
      <a href="Product.html">Product</a>
      <a href="Women.html">Women</a>
      <a href="Men.html">Men</a>
      <a href="Brands.html">Brands</a>
    </nav>
    <div class="login-box">
      <h2 class="heading-login-box">Login</h2>
      <form>
        <div class="user-box">
          <input class="user-box-input" type="text" required />
          <label class="user-box-label">Username</label>
        </div>
        <div class="user-box">
          <input class="user-box-input" type="password" required />
          <label class="user-box-label">Password</label>
        </div>
        <a type="submit" class="login-box-button" href="#">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          Submit
        </a>
      </form>
    </div>
  </body>
</html>
